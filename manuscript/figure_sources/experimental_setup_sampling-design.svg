<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 556 800 356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!--
  Phage-UV experimental setup, panel: Sampling design: 12 physical samples, three measurements each. Standalone source (v2, 2026-09-10), no baked-in
  panel letter or title; the figure legend carries them. Coordinates are kept from the v1
  combined drawing so panels can be re-assembled by translation. Same palette and typography as
  the workflow metro map (manuscript/figure_sources/workflow_metro.svg).
  -->
  <style>
    .ink { fill: #2F2F2F; } .muted { fill: #666666; }
    .h1 { font-size: 17px; font-weight: 600; fill: #2F2F2F; }
    .h2 { font-size: 15px; font-weight: 600; fill: #2F2F2F; }
    .body { font-size: 13px; fill: #2F2F2F; }
    .sub { font-size: 12.5px; fill: #666666; }
    .tiny { font-size: 11px; fill: #666666; }
    .panel { font-size: 20px; font-weight: 700; fill: #2F2F2F; }
    .c-control { fill: #5EA657; } .s-control { stroke: #5EA657; }
    .c-phage { fill: #7E57C2; } .s-phage { stroke: #7E57C2; }
    .c-16s { fill: #6BA6D9; } .c-mg { fill: #416EB0; } .c-mt { fill: #DF6A2C; }
    .flow { fill: none; stroke: #8A8F98; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #2F2F2F; stroke-width: 1.8; }
    .step { fill: #F4F5F7; stroke: #C9CED6; stroke-width: 1.2; }
    .stepT { fill: #F3EEFA; stroke: #B9A6DB; stroke-width: 1.2; }
    .stepC { fill: #EEF6EC; stroke: #A9CFA5; stroke-width: 1.2; }
    .uv { fill: #FFF4D6; stroke: #E0B85A; stroke-width: 1.2; }
    .axis { fill: none; stroke: #2F2F2F; stroke-width: 2; }
    .card { fill: #FAFAF7; stroke: #B9B4A8; stroke-dasharray: 6 4; stroke-width: 1.5; }
    .cardhead { font-size: 12px; letter-spacing: 1px; font-weight: 600; fill: #7A7264; }
    .dot { fill: #FFFFFF; stroke: #2F2F2F; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#8A8F98"/>
    </marker>
    <marker id="arrk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#2F2F2F"/>
    </marker>
  </defs>
  <rect x="30" y="556" width="800" height="356" fill="#FFFFFF"/>
  <g id="panel-c">

    <g class="h2" text-anchor="middle">
      <text x="340" y="580">Cycle 1</text>
      <text x="510" y="580">Cycle 2</text>
      <text x="680" y="580">Cycle 3</text>
    </g>
    <g class="sub" text-anchor="middle">
      <text x="325" y="602">I</text><text x="360" y="602">BF</text>
      <text x="495" y="602">I</text><text x="530" y="602">BF</text>
      <text x="665" y="602">I</text><text x="700" y="602">BF</text>
    </g>

    <text class="h2 c-control" x="230" y="652" text-anchor="end">Control</text>
    <text class="sub" x="230" y="668" text-anchor="end">one membrane</text>
    <text class="h2 c-phage" x="230" y="742" text-anchor="end">Phage-UV</text>
    <text class="sub" x="230" y="758" text-anchor="end">one membrane</text>

    <!-- membrane timelines: dashed = TMP regrowth, solid = cleaning event with I and BF dots -->
    <g class="s-control" fill="none" stroke-linecap="round">
      <path d="M255,648 H780" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M300,648 H370 M470,648 H540 M640,648 H710" stroke-width="5"/>
    </g>
    <g class="s-phage" fill="none" stroke-linecap="round">
      <path d="M255,738 H780" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M300,738 H370 M470,738 H540 M640,738 H710" stroke-width="5"/>
    </g>
    <g fill="none" stroke="#2F2F2F" stroke-width="1.5">
      <path d="M300,634 V662 M470,634 V662 M640,634 V662"/>
      <path d="M300,724 V752 M470,724 V752 M640,724 V752"/>
    </g>
    <text class="tiny" x="300" y="628" text-anchor="middle">cleaning</text>
    <text class="tiny" x="420" y="628" text-anchor="middle">TMP regrowth</text>

    <g id="samples-control" fill="#FFFFFF" stroke="#5EA657" stroke-width="3">
      <circle cx="325" cy="648" r="9"/><circle cx="360" cy="648" r="9"/>
      <circle cx="495" cy="648" r="9"/><circle cx="530" cy="648" r="9"/>
      <circle cx="665" cy="648" r="9"/><circle cx="700" cy="648" r="9"/>
    </g>
    <g id="samples-phage" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3">
      <circle cx="325" cy="738" r="9"/><circle cx="360" cy="738" r="9"/>
      <circle cx="495" cy="738" r="9"/><circle cx="530" cy="738" r="9"/>
      <circle cx="665" cy="738" r="9"/><circle cx="700" cy="738" r="9"/>
    </g>
    <text class="sub" x="510" y="792" text-anchor="middle">2 membranes × 3 cleaning events × 2 fractions = 12 samples, one per cell</text>

    <!-- each sample -> three measurements, laid out in a row -->
    <text class="sub" x="40" y="846">Each sample:</text>
    <g id="omics">
      <rect x="140" y="822" width="12" height="36" rx="4" class="c-16s"/>
      <text class="h2" x="162" y="838">16S rRNA cDNA amplicons</text>
      <text class="sub" x="162" y="855">active community · 2,700 ASVs</text>

      <rect x="372" y="822" width="12" height="36" rx="4" class="c-mg"/>
      <text class="h2" x="394" y="838">Shotgun metagenomes</text>
      <text class="sub" x="394" y="855">12 runs · one per sample</text>

      <rect x="572" y="822" width="12" height="36" rx="4" class="c-mt"/>
      <text class="h2" x="594" y="838">Metatranscriptomes</text>
      <text class="sub" x="594" y="855">23 runs · 11 × 2 + 1 × 1 technical runs</text>
      <text class="sub" x="594" y="871">summed to the physical sample</text>
    </g>
    <text class="tiny" x="40" y="900">Raw reads: ENA study PRJEB79569</text>
  </g>
</svg>
