<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 92 650 362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!--
  Phage-UV experimental setup, panel: Anaerobic membrane bioreactor with two membranes in series. Standalone source (v2, 2026-09-10), no baked-in
  panel letter or title; the figure legend carries them. Coordinates are kept from the v1
  combined drawing so panels can be re-assembled by translation. Same palette and typography as
  the workflow metro map (manuscript/figure_sources/workflow_metro.svg).
  -->
  <style>
    .ink { fill: #2F2F2F; } .muted { fill: #666666; }
    .h1 { font-size: 17px; font-weight: 600; fill: #2F2F2F; }
    .h2 { font-size: 15px; font-weight: 600; fill: #2F2F2F; }
    .body { font-size: 13px; fill: #2F2F2F; }
    .sub { font-size: 12.5px; fill: #666666; }
    .tiny { font-size: 11px; fill: #666666; }
    .panel { font-size: 20px; font-weight: 700; fill: #2F2F2F; }
    .c-control { fill: #5EA657; } .s-control { stroke: #5EA657; }
    .c-phage { fill: #7E57C2; } .s-phage { stroke: #7E57C2; }
    .c-16s { fill: #6BA6D9; } .c-mg { fill: #416EB0; } .c-mt { fill: #DF6A2C; }
    .flow { fill: none; stroke: #8A8F98; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #2F2F2F; stroke-width: 1.8; }
    .step { fill: #F4F5F7; stroke: #C9CED6; stroke-width: 1.2; }
    .stepT { fill: #F3EEFA; stroke: #B9A6DB; stroke-width: 1.2; }
    .stepC { fill: #EEF6EC; stroke: #A9CFA5; stroke-width: 1.2; }
    .uv { fill: #FFF4D6; stroke: #E0B85A; stroke-width: 1.2; }
    .axis { fill: none; stroke: #2F2F2F; stroke-width: 2; }
    .card { fill: #FAFAF7; stroke: #B9B4A8; stroke-dasharray: 6 4; stroke-width: 1.5; }
    .cardhead { font-size: 12px; letter-spacing: 1px; font-weight: 600; fill: #7A7264; }
    .dot { fill: #FFFFFF; stroke: #2F2F2F; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#8A8F98"/>
    </marker>
    <marker id="arrk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#2F2F2F"/>
    </marker>
  </defs>
  <rect x="30" y="92" width="650" height="362" fill="#FFFFFF"/>
  <g id="panel-a">

    <!-- feed -->
    <path class="flow" d="M60,200 H128" marker-end="url(#arr)"/>
    <text class="sub" x="40" y="224">Municipal</text>
    <text class="sub" x="40" y="239">wastewater</text>
    <text class="tiny" x="40" y="254">COD boosted</text>
    <text class="tiny" x="40" y="267">to 750 mg/L</text>

    <!-- reactor tank -->
    <rect class="box" x="140" y="110" width="140" height="240" rx="10"/>
    <rect x="142" y="210" width="136" height="138" fill="#EAF0F7"/>
    <text class="h2" x="210" y="140" text-anchor="middle">AnMBR</text>
    <text class="tiny" x="210" y="158" text-anchor="middle">attached growth</text>
    <text class="tiny" x="210" y="173" text-anchor="middle">35 °C · pH 6.8–7.1</text>
    <text class="tiny" x="210" y="188" text-anchor="middle">anaerobic</text>
    <text class="tiny" x="210" y="255" text-anchor="middle">HRT 18.5 h</text>
    <text class="tiny" x="210" y="270" text-anchor="middle">no sludge wasting</text>
    <text class="tiny" x="210" y="285" text-anchor="middle">SRT ≈ 1 year</text>

    <!-- recirculation loop -->
    <path class="flow" d="M280,150 H320 V132 H352" marker-end="url(#arr)"/>
    <path class="flow" d="M352,296 H320 V318 H282" marker-end="url(#arr)"/>
    <text class="tiny" x="290" y="122">recirculation</text>
    <text class="tiny" x="292" y="340">return</text>

    <!-- cassette 1: Control -->
    <g id="cassette-control">
      <rect class="box s-control" x="356" y="104" width="180" height="62" rx="8" stroke-width="2.5"/>
      <path d="M366,116 H526" stroke="#9BB8D9" stroke-width="3"/>
      <text class="tiny" x="446" y="133" text-anchor="middle">quartz window</text>
      <path d="M366,144 H526" stroke="#2F2F2F" stroke-width="3"/>
      <text class="tiny" x="446" y="159" text-anchor="middle">PVDF membrane · 0.3 µm</text>
      <text class="h2 c-control" x="550" y="128">Control</text>
      <text class="sub" x="550" y="145">Milli-Q water only</text>
    </g>
    <!-- series connection -->
    <path class="flow" d="M446,166 V222" marker-end="url(#arr)"/>
    <text class="tiny" x="456" y="198">in series</text>
    <!-- cassette 2: Phage-UV -->
    <g id="cassette-phage">
      <rect class="box s-phage" x="356" y="226" width="180" height="62" rx="8" stroke-width="2.5"/>
      <path d="M366,238 H526" stroke="#9BB8D9" stroke-width="3"/>
      <text class="tiny" x="446" y="255" text-anchor="middle">quartz window</text>
      <path d="M366,266 H526" stroke="#2F2F2F" stroke-width="3"/>
      <text class="tiny" x="446" y="281" text-anchor="middle">PVDF membrane · 0.3 µm</text>
      <text class="h2 c-phage" x="550" y="250">Phage-UV</text>
      <text class="sub" x="550" y="267">UV-C + phages</text>
    </g>
    <text class="tiny" x="356" y="306">Each membrane in its own cassette: 34 cm²,</text>
    <text class="tiny" x="356" y="320">spacer-limited biofilm; a 4 mm quartz window</text>
    <text class="tiny" x="356" y="334">lets UV-C (254 nm) reach the fouled surface.</text>

    <!-- permeate -->
    <path class="flow" d="M536,296 H585 V362 H612" marker-end="url(#arr)"/>
    <text class="tiny" x="560" y="376">permeate</text>
    <text class="tiny" x="356" y="362">cross-flow · flux 7–8 LMH</text>
    <text class="tiny" x="356" y="376">recirculation : permeate ≈ 600 : 1</text>

    <!-- TMP note -->
    <rect class="card" x="40" y="392" width="580" height="52" rx="8"/>
    <text class="cardhead" x="56" y="412">FOULING TRIGGER</text>
    <text class="body" x="56" y="432">TMP monitored continuously; both membranes cleaned when TMP reaches 40–50 kPa.</text>
  </g>
</svg>
