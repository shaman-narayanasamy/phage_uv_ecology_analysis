<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!--
  Phage-UV integrated multi-omics workflow: metro map, draft v11 (2026-09-09).
  Content = accepted workflow_metro_v10. Grammar = cGAS-STING pipeline schematic draft v3.

  HOW TO EDIT (human or agent)
  - Layers: every <g id="..."> below is one layer. Illustrator and Inkscape show the ids as
    layer/group names. Edit a route by editing its layer; do not move stations without moving
    the route through them.
  - Coordinates: everything sits inside <g id="drawing" transform="translate(0,130)">; the
    130 px offset is headroom for the rotated top labels. Coordinates in comments are
    pre-offset (as written in the file).
  - Bends are 45 degrees: a diagonal always changes x and y by the same amount.
  - Routes are 7 px, round caps. Stations are 18 x 32 pills; a taller pill (46 or 52) is a
    station shared by two routes. Termini are r=6.5 circles. Station rect x = centre - 9,
    y = centre - 16.
  - Colours are defined once in <style>; change a route colour there and it updates the
    routes, the read-bypass labels and the legend.
  - Text is live. Label anchors: text-anchor="middle" for station labels, "end" for
    right-aligned blocks, default left for terminus labels.
  - Render check: headless Chrome screenshot of an HTML wrapper with <img src="this.svg">;
    PDF: Chrome print-to-pdf with @page { size: 1960px 1130px; margin: 0 }.
  -->
  <style>
    .r-amplicon   { stroke: #6BA6D9; }  /* 16S cDNA amplicons */
    .r-metagenome { stroke: #416EB0; }  /* metagenome reads */
    .r-metatx     { stroke: #DF6A2C; }  /* metatranscriptome reads */
    .r-coassembly { stroke: #159A9C; }  /* coassembly products: bins, MAGs, catalogue */
    .r-virus      { stroke: #7B4FA6; }  /* viral sequences / vOTUs */
    .r-host       { stroke: #697D45; }  /* CRISPR host-phage links */
    .r-reference  { stroke: #8A8F98; }  /* shared reference, contig input */
    .t-amplicon   { fill: #6BA6D9; }
    .t-metagenome { fill: #416EB0; }
    .t-metatx     { fill: #DF6A2C; }
    .route  { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .casing { fill: none; stroke: #FFFFFF; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    .station { fill: #FFFFFF; stroke: #2F2F2F; stroke-width: 3; }
    .title { font-size: 15px; font-weight: 600; fill: #2F2F2F; }
    .sub   { font-size: 13px; fill: #666666; }
    .top   { font-size: 17px; font-weight: 600; fill: #2F2F2F; }
    .term  { font-size: 17px; font-weight: 600; fill: #2F2F2F; }
    .bypass { font-size: 13px; font-style: italic; }
    .note  { font-size: 14.5px; font-style: italic; fill: #555555; }
    .key   { font-size: 14.5px; fill: #444444; }
    .keyname { font-size: 15px; fill: #2F2F2F; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
  </defs>

  <rect id="background" x="0" y="0" width="1960" height="1130" fill="#FFFFFF"/>

  <g id="drawing" transform="translate(0,130)">

    <!-- ================= ROUTES ================= -->
    <g id="routes">
      <g id="route-metatranscriptome" class="route r-metatx">
        <!-- origin -> MT QC (300,440) -> up into shared coassembly station (560,344) -->
        <path id="mt-trunk" d="M90,330 H130 L240,440 H360 L456,344 H560"/>
        <!-- fork off the rising trunk into single-omics assemblies (470,385) -->
        <path id="mt-to-single-omics" d="M415,385 H470"/>
        <!-- QC-passed MT reads: bypass under the map, up into shared mapping (1280,414), on to gene counts and edgeR -->
        <path id="mt-read-bypass" d="M360,440 L680,760 H1280 V414 H1300 L1340,454 H1660"/>
      </g>

      <g id="route-metagenome" class="route r-metagenome">
        <!-- origin -> MG read QC (300,330) -> into shared coassembly station (560,330) -->
        <path id="mg-trunk" d="M90,330 H560"/>
        <!-- spur into single-omics assemblies (470,385) -->
        <path id="mg-to-single-omics" d="M300,330 H415 L470,385"/>
        <!-- QC-passed MG reads: bypass over the map, down into shared mapping (1280,400), abundance, community terminus -->
        <path id="mg-read-bypass" d="M330,330 L445,215 H1280 V400 H1300 L1340,360 H1560 L1660,260"/>
        <!-- MG reads forked into MAG-only mapping + inStrain (station 1000,265; terminus 1070,265) -->
        <path id="mg-to-mag-only" d="M840,215 L890,265 H1070"/>
      </g>

      <g id="route-coassembly" class="route r-coassembly">
        <!-- coassembly (560,330) -> bin and refine (760) -> dereplicate (880) -> unified catalogue (1100,400) -->
        <path id="coassembly-products" d="M560,330 H1030 L1100,400"/>
        <!-- dereplicated MAG representatives into MAG-only mapping station (ends at the pill edge) -->
        <path id="mags-to-mag-only" d="M880,330 L945,265 H991"/>
      </g>

      <g id="route-virus" class="route r-virus">
        <!-- single-omics assemblies (470,385) -> viral discovery (830,550) -> pool and cluster (930,550) -> catalogue (1100,414) -->
        <path id="virus-main" d="M470,385 H620 L785,550 H964 L1100,414"/>
        <!-- viral candidates from coassembly merge into the same route -->
        <path id="virus-from-coassembly" d="M560,344 L601,385"/>
      </g>

      <g id="route-amplicon" class="route r-amplicon">
        <!-- origin -> 16S stations (300, 520, 740 at y=150) -> community terminus (1660,260) -->
        <path id="amplicon-trunk" d="M90,330 H100 L280,150 H1550 L1660,260"/>
      </g>

      <g id="route-host">
        <!-- catalogue (1100,414) -> CRISPR host linking (1420,600) -> host-phage terminus (1660,600).
             White casing drawn first so the MT read bypass visibly passes under this route at x=1280. -->
        <path id="host-casing" class="casing" d="M1100,414 V600 H1660"/>
        <path id="host-links" class="route r-host" d="M1100,414 V600 H1660"/>
      </g>

      <g id="route-reference" class="r-reference" fill="none" stroke-linecap="round">
        <!-- unified catalogue supplied as the shared reference for mapping both omics -->
        <path id="reference-to-mapping" d="M1112,407 H1268" stroke-width="3.5"/>
        <!-- MT contigs from single-omics assemblies supplied to coassembly -->
        <path id="mt-contigs-to-coassembly" d="M480,376 L546,352" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      </g>
    </g>

    <!-- ================= ORIGIN ================= -->
    <g id="origin">
      <circle class="station" cx="90" cy="330" r="9"/>
      <text class="title" x="40" y="370">12 samples</text>
      <text class="sub" x="40" y="388">3 cycles · 2 phases</text>
      <text class="sub" x="40" y="404">initial / backflush</text>
      <!-- condition colours from R/figure_style.R (control green, phage-UV purple) -->
      <text x="40" y="424" font-size="13" font-weight="600"><tspan fill="#5EA657">Control</tspan><tspan fill="#666" font-weight="400"> · </tspan><tspan fill="#7E57C2">Phage-UV</tspan></text>
      <text class="sub" x="40" y="446" font-style="italic">anaerobic membrane biofilms</text>
    </g>

    <!-- ================= STATIONS ================= -->
    <g id="stations" class="station">
      <g id="stations-amplicon">
        <rect id="st-16s-cdna"  x="291" y="134" width="18" height="32" rx="9"/>
        <rect id="st-denoise"   x="511" y="134" width="18" height="32" rx="9"/>
        <rect id="st-taxonomy"  x="731" y="134" width="18" height="32" rx="9"/>
      </g>
      <g id="stations-reads">
        <rect id="st-mg-qc" x="291" y="314" width="18" height="32" rx="9"/>
        <rect id="st-mt-qc" x="291" y="424" width="18" height="32" rx="9"/>
        <rect id="st-single-omics" x="461" y="369" width="18" height="32" rx="9"/>
      </g>
      <g id="stations-assembly">
        <!-- shared by MG and MT reads (y 330 and 344) -->
        <rect id="st-coassembly" x="551" y="314" width="18" height="46" rx="9"/>
        <rect id="st-bin-refine" x="751" y="314" width="18" height="32" rx="9"/>
        <rect id="st-dereplicate" x="871" y="314" width="18" height="32" rx="9"/>
      </g>
      <g id="stations-virus">
        <rect id="st-viral-discovery" x="821" y="534" width="18" height="32" rx="9"/>
        <rect id="st-pool-cluster"    x="921" y="534" width="18" height="32" rx="9"/>
      </g>
      <g id="stations-shared">
        <!-- unified catalogue: shared reference (heavier pill) -->
        <rect id="st-catalogue" x="1089" y="381" width="22" height="52" rx="11" stroke-width="3.5"/>
        <!-- mapping of both omics (MG reads y 400, MT reads y 414) -->
        <rect id="st-mapping" x="1271" y="384" width="18" height="46" rx="9"/>
      </g>
      <g id="stations-downstream">
        <rect id="st-mag-only" x="991" y="249" width="18" height="32" rx="9"/>
        <rect id="st-abundance" x="1391" y="344" width="18" height="32" rx="9"/>
        <rect id="st-gene-counts" x="1391" y="438" width="18" height="32" rx="9"/>
        <rect id="st-aggregate-runs" x="1511" y="438" width="18" height="32" rx="9"/>
        <rect id="st-crispr" x="1411" y="584" width="18" height="32" rx="9"/>
      </g>
      <g id="termini">
        <circle id="term-genomic-variation" cx="1070" cy="265" r="6.5"/>
        <circle id="term-community" cx="1660" cy="260" r="6.5"/>
        <circle id="term-edger" cx="1660" cy="454" r="6.5"/>
        <circle id="term-host-phage" cx="1660" cy="600" r="6.5"/>
      </g>
    </g>

    <!-- ================= LABELS ================= -->
    <g id="labels">
      <g id="labels-top-line" class="top">
        <!-- rotated 45 degrees, anchored just above each 16S station -->
        <text x="309" y="122" transform="rotate(-45 309 122)">16S cDNA (cutadapt)</text>
        <text x="529" y="122" transform="rotate(-45 529 122)">Denoise (DADA2)</text>
        <text x="749" y="122" transform="rotate(-45 749 122)">Assign taxonomy (SILVA · 2,700 ASVs)</text>
      </g>

      <g id="labels-stations" text-anchor="middle">
        <g id="lbl-mg-qc"><text class="title" x="300" y="372">Metagenomes</text><text class="sub" x="300" y="390">read QC · 12 runs</text></g>
        <g id="lbl-mt-qc"><text class="title" x="300" y="482">Metatranscriptomes</text><text class="sub" x="300" y="500">QC + rRNA filtering · 23 runs</text></g>
        <g id="lbl-coassembly"><text class="title" x="560" y="292">MG + MT coassembly</text><text class="sub" x="560" y="308">MEGAHIT · per sample</text></g>
        <g id="lbl-single-omics"><text class="title" x="505" y="422">Single-omics assemblies</text><text class="sub" x="505" y="440">MG: Penguin</text><text class="sub" x="505" y="456">MT: MEGAHIT + Penguin</text></g>
        <g id="lbl-bin-refine"><text class="title" x="760" y="294">Bin &amp; refine</text><text class="sub" x="760" y="309">MAGScoT</text></g>
        <g id="lbl-dereplicate"><text class="title" x="880" y="372">Dereplicate</text><text class="sub" x="880" y="390">dRep · across samples</text></g>
        <g id="lbl-mag-only"><text class="title" x="1000" y="240">MAG-only mapping + inStrain</text></g>
        <g id="lbl-viral-discovery"><text class="title" x="830" y="590">Viral discovery</text></g>
        <g id="lbl-pool-cluster"><text class="title" x="930" y="518">Pool &amp; cluster</text><text class="sub" x="930" y="532">Vclust · across samples</text></g>
        <g id="lbl-abundance"><text class="title" x="1400" y="332">Abundance</text><text class="sub" x="1400" y="396">CoverM</text></g>
        <g id="lbl-gene-counts"><text class="title" x="1400" y="494">Gene counts</text><text class="sub" x="1400" y="510">BED-guided coverage</text></g>
        <g id="lbl-aggregate-runs"><text class="title" x="1520" y="418">Aggregate runs</text><text class="sub" x="1520" y="432">12 samples</text></g>
        <g id="lbl-crispr"><text class="title" x="1420" y="572">CRISPR host linking</text><text class="sub" x="1420" y="638">SpacePHARER</text></g>
      </g>

      <g id="lbl-catalogue">
        <text class="title" x="1114" y="324">Unified MAG/vOTU</text>
        <text class="title" x="1114" y="342">catalogue</text>
        <text class="sub" x="1114" y="360">348 MAGs + vOTUs</text>
        <text class="sub" x="1114" y="376">annotated reference</text>
        <text class="sub" x="1114" y="392">gene coordinates</text>
      </g>
      <g id="lbl-mapping" text-anchor="end">
        <text class="title" x="1264" y="449">Map both omics</text>
        <text class="sub" x="1264" y="465">BWA-MEM</text>
      </g>
      <g id="lbl-contig-input">
        <text class="sub" x="522" y="404" font-size="12.5" font-style="italic">MT contigs</text>
      </g>

      <g id="labels-read-bypass" class="bypass" text-anchor="middle">
        <text class="t-metagenome" x="760" y="207">QC-passed MG reads</text>
        <text class="t-metatx" x="980" y="782">QC-passed MT reads</text>
      </g>

      <g id="labels-termini">
        <g id="lbl-genomic-variation" text-anchor="end">
          <text class="title" x="1078" y="292">Genomic variation</text>
          <text class="sub" x="1078" y="308">five selected MAGs</text>
        </g>
        <g id="lbl-community">
          <text class="term" x="1680" y="258">Community structure</text>
          <text class="sub" x="1680" y="276">composition · diversity · trajectories</text>
          <text class="sub" x="1680" y="292">MAG and phage abundance comparisons</text>
        </g>
        <g id="lbl-edger">
          <text class="term" x="1680" y="452">Full-universe edgeR</text>
          <text class="sub" x="1680" y="470">361,907 features · cycle interactions</text>
          <text class="sub" x="1680" y="486">functional interpretation · MAG coherence</text>
        </g>
        <g id="lbl-host-phage">
          <text class="term" x="1680" y="598">Host-phage context</text>
          <text class="sub" x="1680" y="616">86 candidate pairs</text>
        </g>
      </g>
    </g>

    <!-- ================= RESOURCE CARD ================= -->
    <g id="card-viral-tools">
      <path d="M830,568 L830,620" stroke="#999" stroke-dasharray="5 4" fill="none" stroke-width="1.5"/>
      <rect x="700" y="622" width="290" height="76" rx="8" fill="#FAFAF7" stroke="#B9B4A8" stroke-dasharray="6 4" stroke-width="1.5"/>
      <text x="716" y="644" font-size="12" letter-spacing="1" font-weight="600" fill="#7A7264">VIRAL DISCOVERY · TOOLS</text>
      <text x="716" y="666" font-size="13.5" fill="#3D3D3D">geNomad · VirSorter2 · VirALM</text>
      <text x="716" y="685" font-size="13.5" fill="#3D3D3D">DeepMicroClass for coassemblies</text>
    </g>

    <!-- ================= LEGEND ================= -->
    <g id="legend">
      <g id="legend-routes">
        <g class="route">
          <path class="r-amplicon"   d="M60,836 H100"/>
          <path class="r-metagenome" d="M60,862 H100"/>
          <path class="r-metatx"     d="M60,888 H100"/>
          <path class="r-coassembly" d="M60,914 H100"/>
          <path class="r-virus"      d="M60,940 H100"/>
          <path class="r-host"       d="M60,966 H100"/>
        </g>
        <g class="keyname">
          <text x="114" y="841"><tspan font-weight="600">16S cDNA amplicons</tspan> — community composition</text>
          <text x="114" y="867"><tspan font-weight="600">Metagenomes</tspan> — read QC, read mapping, abundance, population genomics</text>
          <text x="114" y="893"><tspan font-weight="600">Metatranscriptomes</tspan> — coassembly input, gene expression</text>
          <text x="114" y="919"><tspan font-weight="600">Coassemblies</tspan> — binning, dereplication, MAG references</text>
          <text x="114" y="945"><tspan font-weight="600">Viral sequences</tspan> — assembly-derived vOTUs</text>
          <text x="114" y="971"><tspan font-weight="600">Host–phage links</tspan> — CRISPR spacer matching</text>
        </g>
      </g>

      <g id="legend-glyphs" class="key">
        <rect x="720" y="835" width="40" height="14" rx="7" fill="#FFFFFF" stroke="#2F2F2F" stroke-width="2.5"/>
        <text x="774" y="847">station — operation on that route</text>
        <rect x="720" y="861" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#2F2F2F" stroke-width="2.5"/>
        <text x="774" y="875">shared station — operation or reference shared by every route passing through</text>
        <circle cx="740" cy="898" r="6.5" fill="#FFFFFF" stroke="#2F2F2F" stroke-width="2.5"/>
        <text x="774" y="903">terminus — current output, not a positive result or a treatment effect</text>
        <path class="r-reference" d="M722,926 H758" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <text x="774" y="931">reference supplied to read mapping</text>
        <path class="r-reference" d="M722,954 H756" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
        <text x="774" y="959">assembled contigs supplied as input</text>
      </g>

      <g id="legend-notes" class="note">
        <text x="1380" y="847">Crossings without stations do not join routes.</text>
        <text x="1380" y="875">Convergence at the community endpoint is complementary interpretation,</text>
        <text x="1380" y="895">not a pooled count table.</text>
        <text x="1380" y="931">One membrane per condition; repeated sampling describes these systems</text>
        <text x="1380" y="951">but does not replicate treatment.</text>
      </g>
    </g>

  </g>
</svg>
